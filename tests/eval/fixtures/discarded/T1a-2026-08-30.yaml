  # Both real claimant directions go down at t3: fiber_satna_jabalpur_0/_1
  # carries claimant-satna-jabalpur-fwd's working path and
  # fiber_jabalpur_satna_0/_1 carries claimant-satna-jabalpur-rev's (the SAME
  # physical corridor, opposite-direction OMS elements) -- confirmed live
  # against the real server (get_affected_services on each of the four
  # fiber ids names exactly that claimant, alongside incidental background
  # traffic riding the same span). This span is AERIAL (Task 5's
  # satna<->jabalpur mount-type change; confirmed against
  # geo_mapper.load_edges), so the storm's own filter genuinely admits this
  # cut (assert_realized_cuts_pass_the_event_filter). storm-svc-1 is NOT cut
