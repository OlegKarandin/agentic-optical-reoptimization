# GEOMETRY FROZEN 2026-08-30 (Task 14, exposure-and-depot plan), against the
# REAL satna-homed claimant `claimant-satna-jabalpur-fwd`/`-rev`
# (satna<->jabalpur, 100 Gbps each direction, co-terminating onto one new
# lightpath). The OLD placeholder claimants (d0029/d0348, allahabad<->kanpur)
# had `cuttable_spans == ()` -- provably unexposable by ANY storm -- so the
# pre-2026-08-30 flip never existed; this rebuild replaces it with the real
# corridor's own exposure. Derived and triple-verified by
# `tools/derive_episodes.py` against a live server
# (docs/superpowers/plans/notes/2026-08-30-joint-tuning.md is the full
# record -- re-run the tool to reproduce every number below digit for digit).
#
# THE CONSTRUCTION, so it can be RE-DERIVED rather than trusted. Both halves'
# t+3 centres are placed by the closed form `lat = origin.lat +
# degrees(d*cos(b)/R)`, `lon = origin.lon + degrees(d*sin(b)/(R*cos(radians(
# lat))))`, `R = events.geo.EARTH_RADIUS_KM = 6371.0`, from storm-svc-1's own
# averaged working-path point `(24.855553333333333, 81.32777666666667)`:
#   * T1a (this file): bearing 195.0 deg (toward the real claimant corridor),
#     radius 150.000000 km -- CHOSEN first.
#   * T1b: bearing 40.0 deg (away from the corridor), radius 77.522705 km --
#     SOLVED (not chosen), by `derive_episodes.solve_radius_for_target_pcut`
#     (grid-then-bisect on the REAL, server-derived `p_cut_region` against
#     storm-svc-1's own span), so storm-svc-1's own p_cut at T1b's cone
#     matches T1a's to below 1e-9. NOT hardcoded as a literal in
#     derive_episodes.py -- it is a function of T1a's own bearing/radius, so
#     re-run the tool (or call `build_t1b_spec`) if either ever changes.
#   * "Same radius, either bearing" (T2/T3's own trick, see those files) does
#     NOT transfer here: at a FIXED radius from storm-svc-1's own averaged
#     point, `nearest_span_offset_km` against its REAL span
#     (satna<->rewa, ~47 km) varies by up to ~90 km across bearing alone,
#     because the averaged point folds in allahabad (on the buried leg),
#     which sits well off the real aerial span's own line. Equal RADIUS is
#     NOT equal EXPOSURE for T1 the way it is for T2/T3's near horizon, which
#     is why T1b's radius had to be SOLVED against the real span instead of
#     merely mirrored.
#
# Confirmed live: storm-svc-1's own p_cut at t+3 is 0.09692530708781567 --
# the SAME FLOAT in T1a and T1b (`assertions._derived_mismatches`,
# DERIVED_TOLERANCE=1e-6) -- even though the two halves' OFFSETS from the
# real span differ (112.500 km here vs 108.789 km in T1b): `p_cut_region`
# integrates a 2-D Gaussian over the storm-svc-1's real span geometry (a
# line, not a point), so two different offset PROFILES along that line can
# still integrate to the identical probability. SUT ecar (300G demand):
# 0.09692530708781567 * 300 = 29.078 G, equal in both halves.
#
# The claimant corridor's own exposure is where the two halves genuinely
# differ: at t+3, `claimant-satna-jabalpur-fwd`/`-rev` each read p_cut
# 0.5910429541466392 here (0.017425803006027314 in T1b) -> group ecar
# (2 * p_cut * 100 G, the co-terminating fwd+rev pair restored by ONE
# lightpath) = 118.20859082932785 G here (3.485160601205463 G in T1b).
