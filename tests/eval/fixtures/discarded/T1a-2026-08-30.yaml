gold:
  # NOT [storm-svc-1, claimant-satna-jabalpur-fwd, claimant-satna-jabalpur-rev]:
  # the claimants are never service_under_test in this pair, and run_episode
  # only ever acts on service_under_test (runner.py's route_service/
  # validate_plan/commit_plan calls are all scoped to
  # scenario.service_under_test) -- there is no mechanism anywhere in this
  # harness that reroutes or restores a service other than the SUT. The
  # claimants ARE realized-cut at t3 above and stay down regardless of what
  # storm-svc-1's decider does. "Hold the spare for them" is the
  # expected-value reasoning that makes waiting the correct call for
  # storm-svc-1's OWN decision, not a claim that the harness actually
  # restores them -- it doesn't, and can't.
  survived: [storm-svc-1]
  max_spares_wasted: 0
  decision_at_t0: wait
  label: wait
  rationale: |
    storm-svc-1's OWN exposure at the t+3 horizon is IDENTICAL in both halves
    of this pair, by construction: p_cut = 0.09692530708781567, the SAME
    float in T1a and T1b (offsets differ -- 112.500 km here, 108.789 km in
    T1b -- because p_cut_region integrates the real span's whole geometry,
    not the scalar offset alone; see the header comment). Nothing about
    storm-svc-1 separates the halves; only what ELSE the storm is about to
    hit does.
      storm-svc-1 (300G)                       p_cut 0.0969 -> 29.078 G expected loss
      claimant-satna-jabalpur-fwd (100G)       p_cut 0.5910 -> 59.104 G
      claimant-satna-jabalpur-rev (100G)       p_cut 0.5910 -> 59.104 G
      the two claimants together (one lightpath restores both) -> 118.2 G
    One spare pair between them. storm-svc-1 is the only service this
    episode's decider can act on, so the real question is whether committing
    the spare to storm-svc-1 now is worth it. The comparison is 29.078 G
    (storm-svc-1's own expected loss) against 118.2 G (the claimant
    corridor's own, honest, one-lightpath expected loss -- the LARGEST
    restorable group at this horizon, not a network-wide sum): the claim
    wins by 89.131 G (306.5% of storm-svc-1's own ecar, 75.4% of the claim's
    own ecar), so committing storm-svc-1's own spare to a 9.7%-odds threat
    would be spending scarce capacity where it is least needed.
    Correct: wait on storm-svc-1, hold the spare.
    At t0 nothing yet distinguishes them -- storm-svc-1 and both claimants
    sit at the same offset (65.299 km) and the same p_cut (0.5716) of the
    shared t0 cone -- and the t+3 exposure is 3 hours out against a 1 h lead
    time, so waiting into t1 is free and buys the revision:
    gold.decision_at_t0 = wait.
    Realized: storm-svc-1 is never cut in this half (only the two claimants
    are, at t3 via fiber_satna_jabalpur_0/_1 and fiber_jabalpur_satna_0/_1)
    -- confirming "wait" cost nothing. Neither claimant is restored by
    anything in this harness (no cross-service restoration exists); the
    episode is scored only on storm-svc-1's survival and on storm-svc-1's
    own spare not being wasted.
    The t1 issuance publishes a single horizon (t+3) in both halves -- no
    nearer nowcast exists to read a raw containment flag off, so the only
    signal available at t1 is this expected-value comparison.
    (The tightest margin in the WHOLE joint construction across all three
    pairs is 31.798 G, T2a's `claimant_ecar_peak_over_horizons`/
    `claimant_ecar_at_earliest_horizon` against THIS half's own 655.4772 G
    network-wide sum at t3 -- T1a is the binder that keeps the whole-suite
    anti-threshold check genuinely blocked; see the joint-tuning notes.)
flip_variable: [svc-b, cone, centre, spare]
metadata:
  # The two REAL named claimants (Task 14, exposure-and-depot plan) --
  # gold.rationale's arithmetic actually weighs these two, restored jointly
  # by one lightpath.
  claimant_services: [claimant-satna-jabalpur-fwd, claimant-satna-jabalpur-rev]
  # "the two claimants together (one lightpath restores both) -> 118.2 G"
  # (gold.rationale, verbatim) -- the honest LARGEST RESTORABLE GROUP figure
  # at this half's only horizon (t3), not a network-wide sum. 118.2, not the
  # header comment's more precise 118.20859082932785: invariant 4
  # (assert_claim_is_one_lightpath) checks this against the AGENT-FACING
  # `observation._restorable_groups` figure, which rounds each service's own
  # p_cut before summing (derived.py's own module docstring: "two readers,
  # two roundings, one quantity") -- confirmed live, 118.2 is what that path
  # actually returns. Task 14, 2026-08-30.
  claimed_competing_ecar_gbps: 118.2
  claimed_competing_ecar_at: t3
  # For the record (Task 14): FlipScalars.largest_restorable_group_ecar_gbps
  # at THIS half's own exposure horizon (t3, the only horizon this pair
  # publishes) -- the UNROUNDED derived.py figure (see the header comment),
  # not the observation-rounded one claimed_competing_ecar_gbps is checked
  # against above. Equal in spirit to claimed_competing_ecar_gbps because
  # T1's claim horizon and exposure horizon coincide (unlike T2/T3, which
  # bill their claim at the NEAR horizon while the SUT's own exposure is
  # graded at the FAR one) -- only the rounding differs.
  largest_restorable_group_ecar_gbps: 118.209
  label_rule: timing_at_decision_hour
  cone_width_km: 90          # EQUAL in T1b -- and EVERY horizon of the
                              # decision-hour issuance is 90 in both halves,
                              # which derived.horizon_widths_km now checks
  cone_motion_kmh: 95.0      # EQUAL in T1b -- offset(t0 centre, t1's t+3
                              # centre) / 1h. Recorded here as the pre-Task-14
                              # declared value; NOT re-derived by this task
                              # (t0 is unchanged, and this is the t0->d
                              # REVISION distance, a different quantity from
                              # derived.within_issuance_cone_motion_kmh, which
                              # is checked live and is 0.0 in both halves
                              # since the t1 issuance publishes a single
                              # horizon).
  n_future_claimants: 2      # EQUAL in T1b -- claimant-satna-jabalpur-fwd and
                              # -rev: the same two services in both halves,
                              # and the only two non-SUT services materially
                              # exposed at t+3 in either half. Only their
                              # exposure differs (0.5910 in T1a, 0.0174 in
                              # T1b).
  exposure_horizon_hours: 2  # EQUAL in T1b
  spares_on_hand: 1          # EQUAL in T1b
  widest_avoid_feasible: true
  # W1.2's whole-suite check needs ONE global orientation, but the three pairs
  # draw gold labels from three vocabularies (act/wait, wide/narrow, A/B).
  # This is the common axis. Deliberately NOT in rules.OBSERVABLE_VARS or
  # assertions.SHARED_SCALARS: it is categorical and it IS the label, so
