realized:
  t3: [fiber_satna_rewa_0]
gold:
  # Real service ids, not the narrative alias "svc-b" -- the harness's own
  # service roster (get_services(), simulate_ip_routing's dropped list) only
  # ever uses real ids, so a literal "svc-b" here could never be found in
  # `survived` regardless of outcome. Neither claimant is realized-cut in T1b
  # (see `realized` above -- only storm-svc-1's own fiber is), so both
  # trivially survive in every replay; naming them correctly here is
  # precision, not a load-bearing check.
  survived: [storm-svc-1, claimant-satna-jabalpur-fwd, claimant-satna-jabalpur-rev]
  max_spares_wasted: 0
  decision_at_t0: wait
  label: act
  rationale: |
    storm-svc-1's OWN exposure at t+3 is the SAME here as in T1a -- p_cut =
    0.09692530708781567, bit for bit -- so no threshold on storm-svc-1's own
    numbers can tell the halves apart. What the revision changes is who ELSE
    is in the way:
      storm-svc-1 (300G)                       p_cut 0.0969 -> 29.078 G expected loss
      claimant-satna-jabalpur-fwd (100G)       p_cut 0.0174 ->  1.743 G
      claimant-satna-jabalpur-rev (100G)       p_cut 0.0174 ->  1.743 G
      the two claimants together (one lightpath restores both) -> 3.48 G
    One spare pair between them. The track resolved away from the
    satna<->jabalpur corridor, so the claim that dominated in T1a has
    collapsed from 118.2 G to 3.48 G -- a tiny fraction of storm-svc-1's
    own 29.078 G. The lead time (1 h) means an optical_reroute committed at
    t1 is effective at t2, strictly before the t3 cut, and no further
    issuance arrives (t2 and t3 carry t1's forward), so waiting past t1 buys
    no information and only erodes the margin. With no better claimant for
    the spare and storm-svc-1 holding the larger expected loss on the board
    by 25.592 G (88.0% of storm-svc-1's own ecar, 734.3% of the claim's own
    ecar), correct: act by t+2 on storm-svc-1.
    At t0 this half is byte-identical to T1a (storm-svc-1 and both claimants
    all at offset 65.299 km, p_cut 0.5716) and the t+3 exposure is 3 hours
    out against a 1 h lead time, so waiting into t1 is free:
    gold.decision_at_t0 = wait.
    Realized: storm-svc-1 is cut at t3 (fiber_satna_rewa_0). 0.0969 is a
    minority outcome, and that is the point -- `realized` is scripted ground
    truth, not the modal draw, and the label is graded on the DECISION the
    expected values justify, not on the coin that came up.
    The t1 issuance publishes a single horizon (t+3) in both halves -- no
    nearer nowcast exists to read a raw containment flag off, so the only
    signal available at t1 is this expected-value comparison.
flip_variable: [svc-b, cone, centre, spare]
metadata:
  # The two REAL named claimants (Task 14, exposure-and-depot plan) -- same
  # two services as T1a; only their exposure differs.
  claimant_services: [claimant-satna-jabalpur-fwd, claimant-satna-jabalpur-rev]
  # "the two claimants together (one lightpath restores both) -> 3.48 G"
  # (gold.rationale, verbatim) -- the honest LARGEST RESTORABLE GROUP figure
  # at this half's only horizon (t3). 3.48, not the header comment's more
  # precise 3.485160601205463 -- see T1a.yaml's identical comment on the
  # observation-rounded vs. derived.py-unrounded distinction invariant 4
  # checks against. Task 14, 2026-08-30.
  claimed_competing_ecar_gbps: 3.48
  claimed_competing_ecar_at: t3
  # For the record (Task 14): FlipScalars.largest_restorable_group_ecar_gbps
  # at THIS half's own exposure horizon (t3) -- the UNROUNDED derived.py
  # figure; see T1a.yaml's identical comment on the two different roundings.
  largest_restorable_group_ecar_gbps: 3.485
  label_rule: timing_at_decision_hour
  cone_width_km: 90          # EQUAL to T1a -- every horizon, both halves
  cone_motion_kmh: 95.0      # EQUAL to T1a -- see T1a.yaml's comment
  n_future_claimants: 2      # EQUAL to T1a -- claimant-satna-jabalpur-fwd and
                              # -rev, the same two services in both halves;
                              # only their exposure differs (0.0174 here,
                              # 0.5910 in T1a)
  exposure_horizon_hours: 2  # EQUAL to T1a
  spares_on_hand: 1          # EQUAL to T1a
  widest_avoid_feasible: true
  # W1.2's whole-suite check needs ONE global orientation, but the three pairs
  # draw gold labels from three vocabularies (act/wait, wide/narrow, A/B).
  # This is the common axis. Deliberately NOT in rules.OBSERVABLE_VARS or
  # assertions.SHARED_SCALARS: it is categorical and it IS the label, so
  # enumerating it would trivially solve every pair.
  gold_spare_action: spend      # gold label "act": commit the pair to storm-svc-1
