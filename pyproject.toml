[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storm-reoptimizer"
version = "0.1.0"
description = "Agentic disaster reoptimization app for multi-layer optical networks (client of multilayer-optical-mcp)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "mcp[cli]>=1.0",
    "shapely>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
# Only eval/agent.py needs this, and only when --include-agent is passed.
# Keeping it out of `dependencies` is what lets the whole test suite -- and a
# plain `python -m storm_reoptimizer.eval.suite` -- run with no SDK and no
# credentials.
agent = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
