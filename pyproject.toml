[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storm-reoptimizer"
version = "0.1.0"
description = "Agentic disaster reoptimization app for multi-layer optical networks (client of multilayer-optical-mcp)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "mcp[cli]>=1.0",
    "shapely>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
# Only eval/agent.py needs this, and only when --include-agent is passed.
# Keeping it out of `dependencies` is what lets the whole test suite -- and a
# plain `python -m storm_reoptimizer.eval.suite` -- run with no SDK and no
# credentials.
agent = ["anthropic>=0.40"]
# Only eval/jev.py needs this, and only when --include-jev is passed. Same
# reasoning as `agent`: the test suite and a plain suite run stay free and
# keyless. >=0.7: Score criteria became a sequence in 0.6, pydantic in 0.7.
jev = ["typesafe-sdk>=0.7"]
# eval/cone.py's exposure model composes scipy's ncx2 (the exact point-target
# answer), Sobol (deterministic low-discrepancy sample locations) and norm.ppf
# (the inverse transform onto a 2-D Gaussian). Kept out of `dependencies`
# because the runtime storm pipeline never imports storm_reoptimizer.eval;
# mandatory in practice for development, since eval/cone.py is imported by
# observation, runner, derived, rules and most of tests/eval/.
eval = ["scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "stale_pair: invariant known-stale on the joint-exposure model; redesign pending (2026-09-05 plan)",
]
