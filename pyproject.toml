[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storm-reoptimizer"
version = "0.1.0"
description = "Agentic disaster reoptimization app for multi-layer optical networks (client of multilayer-optical-mcp)."
requires-python = ">=3.11"
readme = "CLAUDE.md"
dependencies = [
    "mcp[cli]>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
