realized:
  # Both claimants go down at t3: fiber_allahabad_fatehpur_0/_1 carry d0029's
  # working path and fiber_fatehpur_allahabad_0 carries d0348's (the same
  # corridor, opposite-direction OMS) -- confirmed by inject_failure +
  # get_affected_services against the real server. storm-svc-1 is NOT cut in
  # this half, which is what makes "wait" cost nothing here.
  t3: [fiber_allahabad_fatehpur_0, fiber_allahabad_fatehpur_1,
       fiber_fatehpur_allahabad_0]
gold:
  # NOT [storm-svc-1, d0029, d0348]: the claimants are never
  # service_under_test in this pair, and run_episode only ever acts on
  # service_under_test (runner.py's route_service/validate_plan/commit_plan
  # calls are all scoped to scenario.service_under_test) -- there is no
  # mechanism anywhere in this harness that reroutes or restores a service
  # other than the SUT. The claimants ARE realized-cut at t3 above and,
  # confirmed empirically (a clean gold-decision replay: zero actions taken,
  # d0029 reported dropped by simulate_ip_routing with reason "link_down"),
  # they stay down regardless of what storm-svc-1's decider does. "Hold the
  # spare for them" is the expected-value reasoning that makes waiting the
  # correct call for storm-svc-1's OWN decision (why spend the one spare on a
  # 16%-probability threat when 94 G of other traffic sits at 47%), not a
  # claim that the harness actually restores them -- it doesn't, and can't.
  # See docs/superpowers/rehearsals/T1.md's Q2 for the full writeup.
  survived: [storm-svc-1]
  max_spares_wasted: 0
  decision_at_t0: wait
  label: wait
  rationale: |
    storm-svc-1's OWN exposure at the t+3 horizon is IDENTICAL in both halves
    of this pair, by construction: offset 120.62584410267883 km from the
    revised cone axis, p_cut = 0.1614014761182878, the same float in T1a and
    T1b. Nothing about storm-svc-1 separates the halves; only what ELSE the
    storm is about to hit does.
      storm-svc-1 (300G)           p_cut 0.1614 ->  48.4 G expected loss
      d0029 (100G)                 p_cut 0.4715 ->  47.2 G
      d0348 (100G)                 p_cut 0.4715 ->  47.2 G
      the two named claimants together           ->  94.3 G
      every other service, summed                ->  13.3 G
      total expected capacity at risk elsewhere  -> 107.6 G
    One spare pair between them. storm-svc-1 is the only service this
    episode's decider can act on, so the real question is whether committing
    the spare to storm-svc-1 now is worth it. The comparison is 48.4 G against
    107.6 G (94.3 G even counting only the two named claimants); the claimants
    dominate roughly 2:1, so committing storm-svc-1's own spare to a 16%-odds
    threat would be spending scarce capacity where it is least needed.
    Correct: wait on storm-svc-1, hold the spare.
    At t0 nothing yet distinguishes them -- storm-svc-1 and both claimants sit
    at the same offset (65.299 km) and the same p_cut (0.5716) of the shared
    t0 cone -- and the t+3 exposure is 3 hours out against a 1 h lead time, so
    waiting into t1 is free and buys the revision: gold.decision_at_t0 = wait.
    Realized: storm-svc-1 is never cut in this half (only the two claimants
    are, at t3 via fiber_allahabad_fatehpur_0/_1 and fiber_fatehpur_allahabad_0)
    -- confirming "wait" cost nothing. Neither claimant is restored by anything
    in this harness (no cross-service restoration exists); the episode is
    scored only on storm-svc-1's survival and on storm-svc-1's own spare not
    being wasted.
flip_variable: [svc-b, cone, centre, spare]
metadata:
  label_rule: timing_at_decision_hour
  cone_width_km: 90          # EQUAL in T1b -- and EVERY horizon of the
                              # decision-hour issuance is 90 in both halves,
                              # which derived.horizon_widths_km now checks
  cone_motion_kmh: 95.0      # EQUAL in T1b -- offset(t0 centre, t1's t+3
                              # centre) / 1h, = 95.04036836557925 km, the SAME
                              # FLOAT in both halves because the t0 centre
                              # sits on the mirror axis the two t+3 centres
                              # are reflected across. NOT the same quantity as
                              # derived.within_issuance_cone_motion_kmh
                              # (121.03718436910242 in both halves), which is
                              # the t2->t3 leg INSIDE the t1 issuance.
  n_future_claimants: 2      # EQUAL in T1b -- d0029 and d0348: the same two
                              # services in both halves, and the only two
                              # non-SUT services that clear p_cut 0.05 at t+3
                              # in EITHER half (T1a 0.4715, T1b 0.0956). Only
                              # their exposure differs.
  exposure_horizon_hours: 2  # EQUAL in T1b
  spares_on_hand: 1          # EQUAL in T1b
  widest_avoid_feasible: true
  # W1.2's whole-suite check needs ONE global orientation, but the three pairs
  # draw gold labels from three vocabularies (act/wait, wide/narrow, A/B).
  # This is the common axis. Deliberately NOT in rules.OBSERVABLE_VARS or
  # assertions.SHARED_SCALARS: it is categorical and it IS the label, so
  # enumerating it would trivially solve every pair.
  gold_spare_action: conserve   # gold label "wait": hold the pair for the claimants
