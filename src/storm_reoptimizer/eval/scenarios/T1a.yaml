  rationale: |
    At t1, issued_t1 centres the t+3 cone on svc-b (d0029, allahabad<->kanpur, 100G).
      p_cut(svc-b)        = 0.8834 -> expected loss 0.8834 * 100G  = 88.3 G
      p_cut(storm-svc-1)  = 0.1349 -> expected loss 0.1349 * 300G  = 40.5 G
    One spare pair between them. Spending it on storm-svc-1 forecloses svc-b's
    only restoration, so the comparison is 0.1349*300G (40.5G) against
    0.8834*100G (88.3G); the latter dominates. Correct: wait on storm-svc-1,
    hold the spare.
    Realized: svc-b is cut at t3 (fiber_allahabad_fatehpur_0/_1) and the held
    spare restores it.
