    # storm-svc-1 and the claimants are equidistant: BOTH sit at offset
    # 65.299 km, p_cut 0.5716. Nothing here favours either, and storm-svc-1 is
    # OUTSIDE the cone's own 45 km half-width, so a containment-only policy
