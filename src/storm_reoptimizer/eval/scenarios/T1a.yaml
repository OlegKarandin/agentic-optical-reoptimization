# GEOMETRY REBUILT 2026-08-23 (whole-branch review, finding C2). The ORIGINAL
# construction put the t+3 cone on svc-b's own point in T1a and on
# storm-svc-1's own point in T1b -- an exact exchange, which made
# p_cut(storm-svc-1) AT THE EXPOSURE HORIZON 0.1349 in T1a and 0.8834 in T1b.
# A bare threshold on that ONE number -- no comparison to any claimant, no
# reasoning of any kind -- answered the pair 2/2. It survived three rounds of
# review only because rules.py enumerated author-DECLARED metadata and nobody
# had declared that number; derived.py derives it now, and gates the build on
# it.
# The rebuild holds storm-svc-1's OWN exposure EXACTLY equal across the halves
# -- offset 120.62584410267883 km, p_cut 0.1614014761182878 at t+3, the SAME
# FLOAT in both -- and moves the flip entirely into the CLAIMANTS' exposure,
# which is what forces the answer out of a scalar and into an expected-value
# COMPARISON.
# The construction, so it can be re-derived rather than trusted: the two
# halves' t+3 centres are MIRROR IMAGES about storm-svc-1's own meridian
# (identical latitude 25.53004453777238; longitudes 81.32777666666667 -+
# 0.94157310741212). That is not a cosmetic symmetry -- it is what makes
# every derived scalar equal BIT FOR BIT rather than merely to some tolerance:
#   * radial_offset_km(centre, storm-svc-1) -> equal p_cut at the exposure
#     horizon (rules.py enumerates distinct FLOAT values, so "equal to 1e-12"
#     would still have handed a threshold rule the pair);
#   * radial_offset_km(storm-svc-1, centre) -> equal WITHIN-issuance cone
#     motion, the t2->t3 leg of this same issuance: 121.03718436910242 km/h in
#     both halves (derived.within_issuance_cone_motion_kmh -- a DIFFERENT
#     quantity from metadata.cone_motion_kmh below);
#   * and the shared t0 centre sits ON that mirror axis, so it is exactly
#     95.04036836557925 km from BOTH halves' t+3 centres, which is what makes
#     metadata.cone_motion_kmh equal and TRUE rather than merely declared.
# See docs/superpowers/rehearsals/T1.md for the full probe trail.
