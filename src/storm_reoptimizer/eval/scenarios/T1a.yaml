    # "immediate" answered T1a/T1b differently before this horizon existed).
    # After the 2026-08-23 rebuild storm-svc-1's t+3 OFFSET is equal across
    # the halves too, so its raw containment at t+3 is identical either way
    # (120.626 km, outside the 45 km half-width, in both) -- this nowcast is
    # now belt and braces, kept because it is also what makes the t1 acting
    # deadline real.
    t2: {cone: {type: Polygon, coordinates: [[[81.32778, 25.26025], [81.44321, 25.24646], [81.55078, 25.20603], [81.64315, 25.14172], [81.71403, 25.0579], [81.75859, 24.9603], [81.77378, 24.85555], [81.75859, 24.75081], [81.71403, 24.65321], [81.64315, 24.56939], [81.55078, 24.50508], [81.44321, 24.46465], [81.32778, 24.45086], [81.21234, 24.46465], [81.10477, 24.50508], [81.0124, 24.56939], [80.94152, 24.65321], [80.89697, 24.75081], [80.88177, 24.85555], [80.89697, 24.9603], [80.94152, 25.0579], [81.0124, 25.14172], [81.10477, 25.20603], [81.21234, 25.24646], [81.32778, 25.26025]]]},
