    # is the SAME FLOAT T1b's own t+3 cone gives it.
    t3: {cone: {type: Polygon, coordinates: [[[80.3862, 25.93474], [80.50228, 25.92095], [80.61045, 25.88052], [80.70333, 25.81621], [80.7746, 25.73239], [80.81941, 25.63479], [80.83469, 25.53004], [80.81941, 25.4253], [80.7746, 25.3277], [80.70333, 25.24388], [80.61045, 25.17957], [80.50228, 25.13914], [80.3862, 25.12535], [80.27013, 25.13914], [80.16196, 25.17957], [80.06908, 25.24388], [79.9978, 25.3277], [79.953, 25.4253], [79.93772, 25.53004], [79.953, 25.63479], [79.9978, 25.73239], [80.06908, 25.81621], [80.16196, 25.88052], [80.27013, 25.92095], [80.3862, 25.93474]]]},
