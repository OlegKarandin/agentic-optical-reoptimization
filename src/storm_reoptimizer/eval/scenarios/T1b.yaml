realized:
  t3: [fiber_satna_rewa_0]
gold:
  # Real service ids, not the narrative alias "svc-b" -- the harness's own
  # service roster (get_services(), simulate_ip_routing's dropped list) only
  # ever uses real ids, so a literal "svc-b" here could never be found in
  # `survived` regardless of outcome. Neither claimant is realized-cut in T1b
  # (see `realized` above -- only storm-svc-1's own fiber is), so both
  # trivially survive in every replay; naming them correctly here is
  # precision, not a load-bearing check.
  survived: [storm-svc-1, d0029, d0348]
  max_spares_wasted: 0
  decision_at_t0: wait
  label: act
  rationale: |
    storm-svc-1's OWN exposure at t+3 is the SAME here as in T1a -- offset
    120.62584410267883 km, p_cut = 0.1614014761182878, bit for bit -- so no
    threshold on storm-svc-1's own numbers can tell the halves apart. What the
    revision changes is who ELSE is in the way:
      storm-svc-1 (300G)           p_cut 0.1614 -> 48.4 G expected loss
      d0029 (100G)                 p_cut 0.0956 ->  9.6 G
      d0348 (100G)                 p_cut 0.0956 ->  9.6 G
      the two named claimants together           -> 19.1 G
      every other service, summed                ->  2.4 G (d0361, 0.0235)
      total expected capacity at risk elsewhere  -> 21.5 G
    One spare pair between them. The track resolved east, away from the
    allahabad<->kanpur corridor, so the claim that dominated in T1a has
    collapsed from 107.6 G to 21.5 G -- well under half of storm-svc-1's own
    48.4 G. The lead time (1 h) means an optical_reroute committed at t1 is
    effective at t2, strictly before the t3 cut, and no further issuance
    arrives (t2 and t3 carry t1's forward), so waiting past t1 buys no
    information and only erodes the margin. With no better claimant for the
    spare and storm-svc-1 holding the largest single expected loss on the
    board, correct: act by t+2 on storm-svc-1.
    At t0 this half is byte-identical to T1a (storm-svc-1 and both claimants
    all at offset 65.299 km, p_cut 0.5716) and the t+3 exposure is 3 hours out
    against a 1 h lead time, so waiting into t1 is free:
    gold.decision_at_t0 = wait.
    Realized: storm-svc-1 is cut at t3 (fiber_satna_rewa_0). 0.1614 is a
    minority outcome, and that is the point -- `realized` is scripted ground
    truth, not the modal draw, and the label is graded on the DECISION the
    expected values justify, not on the coin that came up.
flip_variable: [svc-b, cone, centre, spare]
metadata:
  label_rule: timing_at_decision_hour
  cone_width_km: 90          # EQUAL to T1a -- every horizon, both halves
  cone_motion_kmh: 95.0      # EQUAL to T1a -- offset(t0 centre, t1's t+3
                              # centre) / 1h, = 95.04036836557925 km, the same
                              # float in both halves because the t0 centre is
                              # on the mirror axis
  n_future_claimants: 2      # EQUAL to T1a -- d0029 and d0348, the same two
                              # services in both halves; only their exposure
                              # differs (0.4715 in T1a, 0.0956 here)
  exposure_horizon_hours: 2  # EQUAL to T1a
  spares_on_hand: 1          # EQUAL to T1a
  widest_avoid_feasible: true
