id: T1b
pair: T1
seed: 17
state_file: eval/states/loaded-s17.json
service_under_test: storm-svc-1
track: hudhud
hours: [t0, t1, t2, t3]
decision_hour: t1
lead_time_hours: 1
spares_on_hand: 1            # transponder PAIRS: one new lightpath each
depot_site: satna            # the site whose depot is scarce in this episode
# Spare transponders held PER SITE. Only depot_site binds; every other site is
# stocked well enough that a candidate is never limited by it, which
# assert_depot_is_the_binding_site checks. Lighting a new lightpath consumes
# one transponder at EACH of its two endpoint sites.
spare_inventory: {satna: 1}
damage_radius_km: 74
reference_avoid: {}          # neutral third value: current exposure only
# GEOMETRY REBUILT 2026-08-23 -- see T1a.yaml's header comment for the full
# statement of the confound (whole-branch review finding C2) and of the
# mirror construction. The one-line version: this half's t+3 cone used to be
# centred on storm-svc-1 ITSELF (p_cut 0.8834) while T1a's was centred 126 km
# away (p_cut 0.1349), so `threshold:sut_p_cut_at_exposure_horizon<0.509` --
# one number, no comparison, no reasoning -- solved the pair 2/2. It now sits
# at the MIRROR IMAGE of T1a's centre about storm-svc-1's own meridian, so
# storm-svc-1's offset (120.62584410267883 km) and p_cut (0.1614014761182878)
# at t+3 are the SAME FLOATS T1a's cone gives it, and the only thing that
# differs is where the claimants fall relative to the axis.
forecast:
  t0:                        # BYTE-IDENTICAL to T1a -- both services ambiguous
    # See T1a.yaml's comment on this entry: on storm-svc-1's own meridian (the
    # mirror axis), at the latitude where storm-svc-1 and the claimants are
    # equidistant, so both read offset 65.299 km / p_cut 0.5716 here, and both
    # halves' t+3 centres are the SAME distance (95.040 km) from it.
    t3: {cone: {type: Polygon, coordinates: [[[81.32778, 25.8475], [81.44377, 25.83371], [81.55186, 25.79328], [81.64467, 25.72896], [81.71589, 25.64515], [81.76067, 25.54754], [81.77594, 25.4428], [81.76067, 25.33806], [81.71589, 25.24045], [81.64467, 25.15664], [81.55186, 25.09232], [81.44377, 25.0519], [81.32778, 25.03811], [81.21178, 25.0519], [81.1037, 25.09232], [81.01088, 25.15664], [80.93966, 25.24045], [80.89489, 25.33806], [80.87962, 25.4428], [80.89489, 25.54754], [80.93966, 25.64515], [81.01088, 25.72896], [81.1037, 25.79328], [81.21178, 25.83371], [81.32778, 25.8475]]]},
         width_km: 90, center: {lat: 25.442800716819043, lon: 81.32777666666667}}
  t1:                        # the revision -- this is what WAIT-past-here does NOT buy
    # ONE horizon, deliberately. This issuance used to also publish a t+1
    # nowcast centred exactly on storm-svc-1's own point (width 90,
    # damage_radius 74) -- p_cut 0.8834, worth 0.8834 x 300 G = 265.0 G, and
    # BYTE-IDENTICAL in both halves. That is 3x the flip magnitude this pair
    # is graded on, and lead_time_hours["ip_reroute"] = 0 made it actionable
    # in the same hour, so every expected-value reasoner answered "act" in
    # BOTH halves while every equality assertion passed. Deleted 2026-08-26
    # (remediation spec, finding F2 / W1.4); relocation was preferred and is
    # geometrically impossible (the cone would have to move ~160 km off the
    # storm's own track before it stopped dominating). Both of its documented
    # jobs survive: the SUT's t+3 offset is already equal across the halves
    # (120.626 km in both), and the t1 acting deadline is still real at
    # lead_time 1 against a t3 cut. assertions.assert_flip_dominates now
    # fails the build if this recurs.
    # THE FLIP. Same width, same latitude, same distance from the t0 axis
    # (95.040 km) and the same distance from storm-svc-1 (120.62584410267883
    # km -> p_cut 0.1614014761182878) as T1a's t+3 cone -- it is T1a's cone
    # reflected across storm-svc-1's meridian. What differs is the BEARING:
    # the track resolves EAST instead of west, 135.7 km from the two claimants
    # -> p_cut 0.0956 each. Nobody is left with a serious claim on the one
    # spare.
    t3: {cone: {type: Polygon, coordinates: [[[82.26935, 25.93474], [82.38543, 25.92095], [82.49359, 25.88052], [82.58648, 25.81621], [82.65775, 25.73239], [82.70255, 25.63479], [82.71783, 25.53004], [82.70255, 25.4253], [82.65775, 25.3277], [82.58648, 25.24388], [82.49359, 25.17957], [82.38543, 25.13914], [82.26935, 25.12535], [82.15327, 25.13914], [82.04511, 25.17957], [81.95222, 25.24388], [81.88095, 25.3277], [81.83615, 25.4253], [81.82086, 25.53004], [81.83615, 25.63479], [81.88095, 25.73239], [81.95222, 25.81621], [82.04511, 25.88052], [82.15327, 25.92095], [82.26935, 25.93474]]]},
         width_km: 90, center: {lat: 25.53004453777238, lon: 82.26934977407878}}
realized:
  t3: [fiber_satna_rewa_0]
gold:
  # Real service ids, not the narrative alias "svc-b" -- the harness's own
  # service roster (get_services(), simulate_ip_routing's dropped list) only
  # ever uses real ids, so a literal "svc-b" here could never be found in
  # `survived` regardless of outcome. Neither claimant is realized-cut in T1b
  # (see `realized` above -- only storm-svc-1's own fiber is), so both
  # trivially survive in every replay; naming them correctly here is
  # precision, not a load-bearing check.
  survived: [storm-svc-1, d0029, d0348]
  max_spares_wasted: 0
  decision_at_t0: wait
  label: act
  rationale: |
    storm-svc-1's OWN exposure at t+3 is the SAME here as in T1a -- offset
    120.62584410267883 km, p_cut = 0.1614014761182878, bit for bit -- so no
    threshold on storm-svc-1's own numbers can tell the halves apart. What the
    revision changes is who ELSE is in the way:
      storm-svc-1 (300G)           p_cut 0.1614 -> 48.4 G expected loss
      d0029 (100G)                 p_cut 0.0956 ->  9.6 G
      d0348 (100G)                 p_cut 0.0956 ->  9.6 G
      the two named claimants together           -> 19.1 G
      every other service, summed                ->  2.4 G (d0361, 0.0235)
      total expected capacity at risk elsewhere  -> 21.5 G
    One spare pair between them. The track resolved east, away from the
    allahabad<->kanpur corridor, so the claim that dominated in T1a has
    collapsed from 107.6 G to 21.5 G -- well under half of storm-svc-1's own
    48.4 G. The lead time (1 h) means an optical_reroute committed at t1 is
    effective at t2, strictly before the t3 cut, and no further issuance
    arrives (t2 and t3 carry t1's forward), so waiting past t1 buys no
    information and only erodes the margin. With no better claimant for the
    spare and storm-svc-1 holding the largest single expected loss on the
    board, correct: act by t+2 on storm-svc-1.
    At t0 this half is byte-identical to T1a (storm-svc-1 and both claimants
    all at offset 65.299 km, p_cut 0.5716) and the t+3 exposure is 3 hours out
    against a 1 h lead time, so waiting into t1 is free:
    gold.decision_at_t0 = wait.
    Realized: storm-svc-1 is cut at t3 (fiber_satna_rewa_0). 0.1614 is a
    minority outcome, and that is the point -- `realized` is scripted ground
    truth, not the modal draw, and the label is graded on the DECISION the
    expected values justify, not on the coin that came up.
    The t1 issuance publishes a single horizon (t+3) in both halves -- no
    nearer nowcast exists to read a raw containment flag off, so the only
    signal available at t1 is this expected-value comparison.
flip_variable: [svc-b, cone, centre, spare]
metadata:
  # The two named claimants gold.rationale's arithmetic actually weighs
  # (d0029, d0348 -- "the two named claimants together"; d0361 is "every
  # other service, summed", not part of the comparison). Task 12,
  # exposure-and-depot plan.
  claimant_services: [d0029, d0348]
  label_rule: timing_at_decision_hour
  cone_width_km: 90          # EQUAL to T1a -- every horizon, both halves
  cone_motion_kmh: 95.0      # EQUAL to T1a -- offset(t0 centre, t1's t+3
                              # centre) / 1h, = 95.04036836557925 km, the same
                              # float in both halves because the t0 centre is
                              # on the mirror axis
  n_future_claimants: 2      # EQUAL to T1a -- d0029 and d0348, the same two
                              # services in both halves; only their exposure
                              # differs (0.4715 in T1a, 0.0956 here)
  exposure_horizon_hours: 2  # EQUAL to T1a
  spares_on_hand: 1          # EQUAL to T1a
  widest_avoid_feasible: true
  # W1.2's whole-suite check needs ONE global orientation, but the three pairs
  # draw gold labels from three vocabularies (act/wait, wide/narrow, A/B).
  # This is the common axis. Deliberately NOT in rules.OBSERVABLE_VARS or
  # assertions.SHARED_SCALARS: it is categorical and it IS the label, so
  # enumerating it would trivially solve every pair.
  gold_spare_action: spend      # gold label "act": commit the pair to storm-svc-1
