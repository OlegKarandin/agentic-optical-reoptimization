  rationale: |
    Wide avoid costs the last spare pair; narrow avoid is an ip_reroute that
    costs none but sits inside the t+3 cone with P(re-exposure) = 0.3.
    T2a: svc-c has groomable survivors (probe: route_service(svc-c) returns an
      ip_reroute candidate), so the spare has no competing claim. Insurance
      costs ~0 and removes 0.3 * 300 G = 90 G of expected loss. Correct: wide.
    T2b: svc-c has no groomable survivor (probe: route_service(svc-c) returns
      optical_reroute only), so the spare is certainly claimed. Insurance costs
      1.0 * 300 G later to remove 0.3 * 300 G now. Correct: narrow.

    Real numbers, this half: route_service(storm-svc-1, avoid={}, basis=
    physical, level=link) returns candidate_0 -- an ip_reroute reusing
    storm-svc-1's own EXISTING working lightpath (lp-cand-storm-svc-1-0,
    satna<->rewa<->allahabad) unchanged, restored_gbps=300, 0 spare pairs --
    confirmed against the real server to validate cleanly (it stays disjoint
    from the static protection leg because nothing physically moved). It sits
    inside both the t2 and t6 cones -- no insurance bought -- which is
    correct here because svc-c will certainly need the one spare.
