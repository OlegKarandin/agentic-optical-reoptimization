  rationale: |
    ONE spare transponder pair, two claims on it.
      * Spend it now on insurance for storm-svc-1 (WIDE avoid: route clear of
        the full far-horizon group -- an optical_reroute via jabalpur costing
        1 pair) and its 0.49178301670862895 x 300 G = 147.535 G of expected
        loss at t6 goes away.
      * Hold it (NARROW avoid: avoid={}, an ip_reroute that reuses the current
        lightpath and costs nothing) and it stays available for
        claimant-satna-jabalpur-fwd/-rev, which the t2 cone lands on -- cut an
        hour BEFORE storm-svc-1's own exposure at t6, so they reach the pair
        first.
    Both halves publish the SAME far horizon and therefore the SAME 147.535 G;
    only the near horizon's centre moves, and with it the competing claim.

    Real numbers, this half: the t2 cone (250.0 km from storm-svc-1, width 60,
    bearing 213.0 deg) sits deep on the real satna<->jabalpur corridor.
      claimant-satna-jabalpur-fwd  100G  p_cut 0.9888761730373083 -> 98.888 G
      claimant-satna-jabalpur-rev  100G  p_cut 0.9888761730373083 -> 98.888 G
      the two claimants together (one lightpath restores both) -> 197.78 G
    197.78 G > 147.535 G: the pair is more valuable held for the hour-earlier
    claimant than spent on insurance for storm-svc-1. Correct: NARROW.
    Margin: 50.240 G (34.1% of storm-svc-1's own ecar, 25.4% of the claim's
    own ecar) -- both comfortably above `cone.py`'s own documented ~2.56e-4
    Sobol sampling noise floor (~0.05 G at these 100-300 G demands).

    route_service(storm-svc-1, avoid={}, basis=physical, level=link) returns
    candidate_0 -- an ip_reroute reusing storm-svc-1's own EXISTING working
    lightpath (lp-cand-storm-svc-1-0, satna<->rewa<->allahabad) unchanged,
    restored_gbps=300, 0 spare pairs -- confirmed against the real server to
    validate cleanly (it stays disjoint from the static protection leg because
    nothing physically moved). It sits inside the t6 cone -- no insurance
    bought -- which is correct here because the pair is worth more to the
    claimant corridor.

