  rationale: |
    Menu is identical in both halves (avoid={}, same 10 candidates, same cost
    vectors -- see T3a.yaml's rationale for the full menu description and the
    proof that no candidate ever shows a Gbps shortfall for storm-svc-1's own
    demand on this real network).
    candidate_0 (ip_reroute, reuse storm-svc-1's own working lightpath
    unchanged, 0 spare pairs) leaves it on the exposed corridor; real cost =
    p_cut(t6) = 0.25880827038986803 -> 77.642 G given up now by staying in
    place. That number is EQUAL in both halves, so nothing keyed on
    storm-svc-1's own geometry separates them.
    candidate_4 (optical_reroute via jabalpur, 1 spare pair -- the last one on
    hand) physically clears both storm-svc-1's working AND protection
    corridors, validated disjoint under basis=risk_group/level=risk_group.
    T3a: the near cone (bearing 204.0 deg) lands away from the claimant
      corridor's own strongest exposure --
      claimant-satna-jabalpur-fwd/-rev  100G each  p_cut 0.3371023117418174
      -> 67.420 G expected capacity at risk later (one lightpath restores
      both directions). 77.642 G > 67.420 G. Correct: A.
    T3b (this half): the near cone (bearing 213.0 deg) lands directly on the
      claimant corridor.
      claimant-satna-jabalpur-fwd  100G  p_cut 0.6115358205539025 -> 61.154 G
      claimant-satna-jabalpur-rev  100G  p_cut 0.6115358205539025 -> 61.154 G
      the two claimants together (one lightpath restores both) -> 122.3 G
      77.642 G given up now < 122.3 G expected later (margin 44.665 G,
      57.5% of storm-svc-1's own ecar, 36.5% of the claim's own ecar -- both
      comfortably above `cone.py`'s own documented ~2.56e-4 Sobol sampling
      noise floor). Correct: B (commit candidate_0, keep the last spare pair
      for the far more valuable future claim -- spending it now on
      candidate_4 would leave nothing on hand when the claimant corridor's
      own restoration need arrives).
    Neither the claimant IDENTITY (the same two real services in both
    halves), the MENU (identical in both halves), nor storm-svc-1's own
    re-exposure cost (77.642 G, equal in both halves) separates T3a from
    T3b -- only the PRODUCT of the claimants' rate (100G each) and their
    exposure probability (67.420 G total vs 122.3 G total, the actual
    flip) does. (Nine OTHER background services also ride the physical
    satna<->jabalpur span and are exposed at essentially the same p_cut
    whenever this corridor is hit -- none terminate at satna, so none are
    depot-eligible and none belong in this comparison; see
    docs/superpowers/plans/notes/2026-08-30-joint-tuning.md.)
