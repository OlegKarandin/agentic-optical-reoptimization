id: D1
# no `pair` key: D1 is a singleton diagnostic, excluded from pair_solved
# (rules.py's _by_pair groups it alone under its own id, and
# assert_no_single_variable_rule_solves only checks groups of size > 1 --
# a lone episode is trivially "solved" by any rule and that is fine, since
# this episode's job is attribution, not discrimination against a twin).
seed: 17
state_file: eval/states/loaded-s17.json
service_under_test: storm-svc-1
track: hudhud
hours: [t0, t1]
decision_hour: t0
lead_time_hours: 1
spares_on_hand: 2            # transponder PAIRS: two on hand, so acting is
                              # never a scarcity trade -- the whole point of
                              # this episode is that "hold the spare" has no
                              # excuse here (design doc's "Why D1 exists")
depot_site: satna            # the site whose depot is scarce in this episode
# Spare transponders held PER SITE. Only depot_site binds; every other site is
# stocked well enough that a candidate is never limited by it, which
# assert_depot_is_the_binding_site checks. Lighting a new lightpath consumes
# one transponder at EACH of its two endpoint sites.
spare_inventory: {satna: 2}  # D1 declares {satna: 2}
damage_radius_km: 74
reference_avoid:             # NOT {} -- see "The real mechanics" below. This
                              # is also the ACTUAL avoid the gold act uses.
  assets: [fiber_satna_rewa_0, fiber_rewa_satna_0,
           fiber_satna_jhansi_0, fiber_satna_jhansi_1, fiber_satna_jhansi_2,
           fiber_jhansi_satna_0, fiber_jhansi_satna_1, fiber_jhansi_satna_2]
forecast:
  t0:                         # one issuance, one horizon -- decision_hour IS
                              # t0, so there is nothing to revise; D1 has no
                              # "what wait buys" horizon by design (waiting
                              # past t0 forecloses action entirely, since
                              # lead_time_hours=1 == hours to exposure)
    t1: {cone: {type: Polygon, coordinates: [[[80.83333, 24.65078], [80.85253, 24.64848], [80.87042, 24.64174], [80.88578, 24.63102], [80.89757, 24.61705], [80.90497, 24.60079], [80.9075, 24.58333], [80.90497, 24.56587], [80.89757, 24.54961], [80.88578, 24.53564], [80.87042, 24.52492], [80.85253, 24.51818], [80.83333, 24.51588], [80.81413, 24.51818], [80.79624, 24.52492], [80.78088, 24.53564], [80.76909, 24.54961], [80.76169, 24.56587], [80.75916, 24.58333], [80.76169, 24.60079], [80.76909, 24.61705], [80.78088, 24.63102], [80.79624, 24.64174], [80.81413, 24.64848], [80.83333, 24.65078]]]},
         width_km: 15, center: {lat: 24.58333, lon: 80.83333}}
         # centred on satna -- the node where BOTH of storm-svc-1's
         # corridors originate -- not on storm-svc-1's own representative
         # point (24.855553333333333, 81.32777666666667). UNCHANGED by Task
         # 14 -- confirmed via `tools/derive_episodes.py` that this geometry
         # needs no retune (see the "GEOMETRY, RECONFIRMED" comment below for
         # what DID change: the real numbers this cone implies under the
         # corrected exposure model, and the real claimant identity now
         # sharing this exact pivot node).
realized:
  t1: [fiber_satna_rewa_0]     # storm-svc-1's own WORKING-path fiber --
                                # confirmed against the real server:
                                # get_affected_services(fiber_satna_rewa_0)
                                # returns storm-svc-1 (and d0423, incidental)
                                # BEFORE any reroute. NOTE (found in Task 17's
                                # review): only the WORKING corridor is ever
                                # realized-cut here -- the PROTECTION corridor
                                # (satna<->jhansi) is never touched, and
                                # simulate_ip_routing's final reconvergence
                                # picks it up automatically regardless of any
                                # decision. Confirmed empirically: a decider
                                # that never acts at all still shows
                                # storm-svc-1 in services_survived. This is
                                # NOT specific to D1 -- T1b has the identical
                                # single-corridor-realized-cut structure. So
                                # "if the decider waits, this same cut downs
                                # it" (below) is NOT literally true as
                                # services_survived measures it --
                                # gold.survived is not a discriminating check
                                # for this episode. What IS discriminating is
                                # decision_label (the raw act/wait choice at
                                # t0), which does not depend on outcome at
                                # all -- see scoring.py's module docstring
                                # ("Flip-variable citation is NECESSARY, NOT
                                # SUFFICIENT... not reasoning verification")
                                # for why the harness scores the categorical
                                # choice, not the physical result.
gold:
  survived: [storm-svc-1]
  max_spares_wasted: 0
  decision_at_t0: act
  label: act
  rationale: |
    180 km cone at t+1, storm-svc-1 dead-centre -- the design doc's own
    framing; the PROBED geometry deviates from a literal 180km/storm-svc-1's-
    own-point cone for two reasons carried over from real testing (see "The
    real mechanics" below), but the substance is unchanged.

    GEOMETRY, RECONFIRMED (Task 14, exposure-and-depot plan, 2026-08-30): this
    cone's geometry is UNCHANGED -- confirmed live via `tools/derive_episodes.py`
    that no retune is needed -- but two numbers it implies moved under the
    corrected, real-span-based exposure model, and a third finding is new
    under the real claimant identity:
      * p_cut(storm-svc-1) = 1.000000 (was 0.9761 under the old
        midpoint-based model) -> 1.0 * 300G = 300.0 G expected loss if the
        network waits and the working-path fiber (fiber_satna_rewa_0) goes
        down as realized at t1.
      * offset_km(storm-svc-1) = 0.000000 (was 58.4457 km under the old
        averaged-midpoint model) -- the corrected model reads the NEAREST
        POINT of storm-svc-1's real storm-cuttable span, which sits exactly
        at satna, this cone's own centre.
      * The REAL satna-homed claimant, claimant-satna-jabalpur-fwd/-rev
        (satna<->jabalpur, pinned Task 7), was NOT threaded through this
        episode's own prose when it was first written (the span was buried
        until Task 5's mount-type change) -- so the ORIGINAL claim below
        ("no other service... exceeds p_cut = 0.0120", "n_future_claimants =
        0") was true when written but is now FALSE under the real claimant
        identity, and Task 14 corrects it here rather than leaving it stale.
    Because BOTH of storm-svc-1's own corridors (satna<->rewa working,
    satna<->jhansi protection) AND the real claimant corridor
    (satna<->jabalpur) all originate at the exact node this cone is centred
    on, the real claimant now ALSO reads p_cut = 1.000000 here -- the SAME
    certainty as storm-svc-1's own exposure, not a distant, low-probability
    nuisance:
      storm-svc-1 (300G)                       p_cut 1.0000 -> 300.000 G
      claimant-satna-jabalpur-fwd (100G)       p_cut 1.0000 -> 100.000 G
      claimant-satna-jabalpur-rev (100G)       p_cut 1.0000 -> 100.000 G
      the two claimants together (one lightpath restores both) -> 200.000 G
    This IS a genuine, real competing claim on this depot's spare pool --
    unlike every other claim in this suite, D1 declares TWO spare pairs on
    hand (spare_inventory: {satna: 2}), not one. Confirmed live against the
    real menu: storm-svc-1's own restoration candidates each need 1 spare
    pair at satna (plus 1 at allahabad, a non-scarce site); the claimant
    corridor's own hypothetical restoration (never actually invoked by this
    harness -- no cross-service restoration exists) would likewise need only
    1 spare pair at satna (plus 1 at jabalpur, also non-scarce). 1 (this
    episode's own action) + 1 (the claimant's hypothetical need) = 2, exactly
    matching the 2 pairs on hand -- so acting on storm-svc-1 now still leaves
    the FULL 1 pair the claimant corridor would need, genuinely uncontested.
    D1's "no excuse to wait" framing survives the real claimant identity
    intact, but for a reason now made explicit rather than assumed: this
    episode's OWN doubled depot stock, not an absence of competition.
    (Nine OTHER background services also ride the physical satna<->jabalpur
    span at this same cone and read p_cut 1.0 too -- network-wide sum
    1100.0 G -- but none terminate at satna, so none are depot-eligible and
    none belong in this comparison; see
    docs/superpowers/plans/notes/2026-08-30-joint-tuning.md.)

    Hours to exposure (1) equals the optical_reroute lead time, so waiting
    past t0 forecloses action entirely -- t0 is both the decision hour and
    the only hour before the storm reaches its own currently-exposed
    corridor. Expected cost of acting ~ 0 (the claimant corridor's own
    restoration need is fully covered by the 1 pair remaining afterward)
    against 300.0 G of expected loss if the network waits. Correct: act at
    t0.

    PRECONDITION: the menu contains no ip_reroute candidate.
    test_d1_menu_contains_no_ip_reroute_candidate asserts this for real
    against the live server. A zero-lead-time option would make waiting free
    and silently invert this label -- see "The real mechanics" below for why
    this needed a non-trivial reference_avoid to hold.
flip_variable: [uncontested, spare, lead]
metadata:
  # The two REAL named claimants (Task 14, exposure-and-depot plan,
  # 2026-08-30). D1's own doubled spare stock (2 pairs, not 1) is what keeps
  # gold.label='act' correct even though this claim is now real and
  # certain (p_cut=1.0) -- see gold.rationale above for the real
  # spares_needed arithmetic.
  claimant_services: [claimant-satna-jabalpur-fwd, claimant-satna-jabalpur-rev]
  # "the two claimants together (one lightpath restores both) -> 200.000 G"
  # (gold.rationale, verbatim) -- the honest LARGEST RESTORABLE GROUP figure
  # at this episode's only horizon (t1). Task 14, 2026-08-30.
  claimed_competing_ecar_gbps: 200.0
  claimed_competing_ecar_at: t1
  # For the record (Task 14): FlipScalars.largest_restorable_group_ecar_gbps
  # at this episode's own exposure horizon (t1) -- equal to
  # claimed_competing_ecar_gbps above, D1 publishes only one horizon.
  largest_restorable_group_ecar_gbps: 200.0
  label_rule: timing_at_decision_hour
  cone_width_km: 15             # NOT 180 -- see "The real mechanics" below
  cone_motion_kmh: 0.0           # single issuance, no revision to diff
                                  # against (D1 has only one forecast entry)
  # 2 (Task 14, 2026-08-30) -- claimant-satna-jabalpur-fwd/-rev, the two REAL
  # services genuinely exposed (p_cut=1.0) at this cone. NOT 0: the original
  # value was true only of the OLD placeholder claimants, which had no real
  # aerial exposure at all (see gold.rationale above). D1's own doubled
  # spare stock is what keeps this non-zero count from changing the label.
  n_future_claimants: 2
  exposure_horizon_hours: 1
  spares_on_hand: 2
  widest_avoid_feasible: true
  no_ip_reroute_in_menu: true
