# file: centred ON storm-svc-1's own point, width 320. Confirmed live:
# storm-svc-1's own p_cut there under the CORRECTED (real-span-based)
# exposure model is 0.25880827038986803 -- ecar 77.64248111696041 G on its
# 300G demand. (This is a DIFFERENT number from the pre-Task-3 midpoint-based
# model's 0.3410052087 -- the cone did not move, but the model computing
# p_cut against it did.)
#
# The NEAR horizon (t2, the claimant horizon) moved to radius 290.0 km from
# storm-svc-1's own point (NOT the shipped 228.0754620624 km -- see below for
# why), bearing 204.0 deg here (213.0 deg in T3b), placed by the closed form
# `lat = origin.lat + degrees(d*cos(b)/R)`, `lon = origin.lon +
# degrees(d*sin(b)/(R*cos(radians(lat))))`, `R = events.geo.EARTH_RADIUS_KM
# = 6371.0`.
#
# **Why 290.0 km, not the shipped 228.0754620624 km.** At the shipped radius,
# storm-svc-1's own REAL span-based p_cut differs measurably between the two
# bearings needed here (3.05e-5 at one vs 2.14e-4 at the other -- a delta
# over 100x DERIVED_TOLERANCE=1e-6, even though both "look like zero" printed
# to 8 decimals). 290.0 km makes both halves read the EXACT SAME FLOAT
# (0.0): confirmed live by counting `shapely.contains` against `cone.py`'s
# own fixed 65,536-point Sobol sample set -- ZERO of those points land in the
# (small) danger region at either offset (244.08 km here, 238.41 km in T3b),
# a stable equality given the fixed, unscrambled Sobol point set is a
# documented contract, not a "clears N-sigma" distance guarantee (both
# offsets sit BELOW `p_cut_region`'s NEGLIGIBLE_SIGMAS fast-path threshold of
# 74 + 6*30.64 = 257.8 km at width_km=90, so the full integration runs
# either way).
#
# Confirmed live via `claimant-satna-jabalpur-fwd`'s own real p_cut at this
# cone: 0.3371023117418174 -> group ecar (2 * p_cut * 100 G, the
# co-terminating fwd+rev pair restored by ONE lightpath) = 67.42046234836347 G.
