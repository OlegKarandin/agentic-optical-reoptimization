gold:
  survived: [storm-svc-1]
  max_spares_wasted: 0
  decision_at_t0: wait
  label: A
  rationale: |
    Real menu at t1 under avoid={} (protected=False, basis=physical for menu
    generation -- basis only matters for validate_plan/commit_plan, never for
    candidate generation in unprotected mode -- confirmed against
    route_service.py's source): 10 candidates. candidate_0 is ip_reroute,
    reusing storm-svc-1's own CURRENT working lightpath (lp-cand-storm-svc-1-0,
    satna<->rewa<->allahabad) completely UNCHANGED -- restored=300G,
    shortfall=0G, 0 spare pairs. candidate_4 is optical_reroute, a NEW
    lightpath via jabalpur (satna<->jabalpur<->damoh<->sagar<->rajgarh<->
    gwalior<->jhansi<->allahabad) -- restored=300G, shortfall=0G, 1 spare pair
    (the LAST one on hand). Both candidates fully restore storm-svc-1's 300G;
    the menu is genuinely identical in both T3 halves (same avoid={}, same
    candidates, same cost vectors -- confirmed by
    test_pair_menus_are_identical_under_reference_avoid). Neither candidate
    shows a Gbps SHORTFALL against storm-svc-1's own demand on this real
    network (its working AND protection lightpaths are both provisioned at
    800G, far above its 300G demand, so no reachable groom candidate for
    storm-svc-1 is ever capacity-limited -- confirmed by exhaustive probing,
    see docs/superpowers/rehearsals/T3.md's Q0 for the full derivation). The
    real trade is therefore not "restored vs shortfall" but "exposed vs safe":
    candidate_0 leaves storm-svc-1 UNCHANGED on the currently-exposed working
    corridor (satna<->rewa, still inside the widened t6 cone); candidate_4
    physically moves it off both the working AND protection corridors via
    jabalpur (validated disjoint under basis=risk_group/level=risk_group --
    jhansi<->allahabad is buried, so risk-group-basis validation does not
    treat it as shared with protection even though candidate_4's route ends
    on it -- the same mechanic T2's rehearsal doc derives in full).

    Candidate B's (candidate_0's) real cost is storm-svc-1's own re-exposure:
    p_cut(offset=0, width=320, damage_radius=74) = 0.3410 -> 0.3410*300G =
    102.3 G given up now by staying in place.
    T3a: 2 claimants (d0462, d0212, 100G each) at p_cut=0.2226 (probe:
      cut_probability(110.0, 90.0, 74.0)) -> 2*100*0.2226 = 44.5 G expected
      capacity at risk later.
      102.3 G given up now > 44.5 G expected later. Correct: A (spend the
      last spare pair on candidate_4; the future claim is not yet worth
      insuring against).
    T3b: 2 claimants (same d0462, d0212) at p_cut=0.8834 (probe:
      cut_probability(0.0, 90.0, 74.0)) -> 2*100*0.8834 = 176.7 G expected
      capacity at risk later.
      102.3 G given up now < 176.7 G expected later. Correct: B (commit
      candidate_0, keep the last spare pair for the far more valuable future
      claim).
    Neither the claimant COUNT (2, equal in both halves), the MENU (identical
    in both halves), nor storm-svc-1's own re-exposure cost (102.3 G, equal
    in both halves) separates T3a from T3b -- only the PRODUCT of the two
    claimants' rate (100G, equal here) and exposure probability (0.2226 vs
    0.8834, the actual flip) does.
flip_variable: [claimant, expected, rate, probability]
