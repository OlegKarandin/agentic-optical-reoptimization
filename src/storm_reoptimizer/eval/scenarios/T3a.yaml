gold:
  survived: [storm-svc-1]
  max_spares_wasted: 0
  decision_at_t0: wait
  label: A
  rationale: |
    Real menu at t1 under avoid={} (protected=False, basis=physical for menu
    generation -- basis only matters for validate_plan/commit_plan, never for
    candidate generation in unprotected mode -- confirmed against
    route_service.py's source): 10 candidates. candidate_0 is ip_reroute,
    reusing storm-svc-1's own CURRENT working lightpath (lp-cand-storm-svc-1-0,
    satna<->rewa<->allahabad) completely UNCHANGED -- restored=300G,
    shortfall=0G, 0 spare pairs. candidate_4 is optical_reroute, a NEW
    lightpath via jabalpur (satna<->jabalpur<->damoh<->sagar<->rajgarh<->
    gwalior<->jhansi<->allahabad) -- restored=300G, shortfall=0G, 1 spare pair
    (the LAST one on hand). Both candidates fully restore storm-svc-1's 300G;
    the menu is genuinely identical in both T3 halves (same avoid={}, same
    candidates, same cost vectors -- confirmed by
    test_pair_menus_are_identical_under_reference_avoid). Neither candidate
    shows a Gbps SHORTFALL against storm-svc-1's own demand on this real
    network (its working AND protection lightpaths are both provisioned at
    800G, far above its 300G demand, so no reachable groom candidate for
    storm-svc-1 is ever capacity-limited). The real trade is therefore not
    "restored vs shortfall" but "exposed vs safe": candidate_0 leaves
    storm-svc-1 UNCHANGED on the currently-exposed working corridor
    (satna<->rewa, still inside the widened t6 cone); candidate_4 physically
    moves it off both the working AND protection corridors via jabalpur
    (validated disjoint under basis=risk_group/level=risk_group --
    jhansi<->allahabad is buried, so risk-group-basis validation does not
    treat it as shared with protection even though candidate_4's route ends
    on it -- the same mechanic T2's rationale derives in full).

    Candidate B's (candidate_0's) real cost is storm-svc-1's own re-exposure:
    p_cut(t6) = 0.25880827038986803 -> 0.25880827038986803 * 300G =
    77.642 G given up now by staying in place. That number is EQUAL in both
    halves -- the t6 cone is byte-identical. Nothing keyed on storm-svc-1's
    own geometry separates T3a from T3b.
    T3a: the near cone (bearing 204.0 deg, radius 290.0 km) lands away from
    the real claimant corridor's own strongest exposure.
      claimant-satna-jabalpur-fwd  100G  p_cut 0.3371023117418174 -> 33.710 G
      claimant-satna-jabalpur-rev  100G  p_cut 0.3371023117418174 -> 33.710 G
      the two claimants together (one lightpath restores both) -> 67.420 G
      77.642 G given up now > 67.420 G expected later (margin 10.222 G, 13.2%
      of storm-svc-1's own ecar, 15.2% of the claim's own ecar -- both
      comfortably above `cone.py`'s own documented ~2.56e-4 Sobol sampling
      noise floor). Correct: A (spend the last spare pair on candidate_4; the
      future claim is not yet worth insuring against).
    T3b: the near cone lands directly on the claimant corridor -- see
      T3b.yaml's own rationale for its real numbers (122.3 G expected
      later, against the SAME 77.642 G storm-svc-1 re-exposure cost).
      Correct: B.
    Neither the claimant IDENTITY (the same two real services in both
    halves), nor the MENU (identical in both halves), nor storm-svc-1's own
    re-exposure cost (77.642 G, equal in both halves) separates T3a from
    T3b -- only the PRODUCT of the claimants' rate (100G each) and their
    exposure probability (67.420 G total vs 122.3 G total, the actual
    flip) does. (Nine OTHER background services also ride the physical
    satna<->jabalpur span and are exposed at essentially the same p_cut
    whenever this corridor is hit -- none terminate at satna, so none are
    depot-eligible and none belong in this comparison; see
    docs/superpowers/plans/notes/2026-08-30-joint-tuning.md.)
flip_variable: [claimant, expected, rate, probability]
