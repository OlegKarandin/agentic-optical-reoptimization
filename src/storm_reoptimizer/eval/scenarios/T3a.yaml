realized: {}                 # nothing realized-cut this episode -- neither
                              # storm-svc-1 nor the claimant services (d0462,
                              # d0212, d0363) are ever cut within this
                              # episode's own hours. The claimants' exposure
                              # is EXPECTED capacity at risk LATER (beyond
                              # hour t6, this episode's own horizon) --
                              # run_episode has no code path that could
                              # restore a non-SUT service anyway (see
                              # docs/superpowers/rehearsals/T1.md's Q2), so
                              # gold.survived below names only storm-svc-1,
