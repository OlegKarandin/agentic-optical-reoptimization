realized: {}                 # EQUAL in T2b -- nothing realized-cut this episode.
                              # storm-svc-1 is never at risk of being dropped
                              # either way, so gold.survived is trivially
                              # satisfiable and the pair scores purely on WHICH
                              # avoid the committed candidate used
                              # (decision_label), not on outcome.
gold:
  survived: [storm-svc-1]
  max_spares_wasted: 0
  decision_at_t0: wait
  label: wide
  rationale: |
    ONE spare transponder pair, two claims on it.
      * Spend it now on insurance for storm-svc-1 (WIDE avoid: route clear of
        the full far-horizon group -- an optical_reroute via jabalpur costing
        1 pair) and its 0.49178301670862895 x 300 G = 147.535 G of expected
        loss at t6 goes away.
      * Hold it (NARROW avoid: avoid={}, an ip_reroute that reuses the current
        lightpath and costs nothing) and it stays available for
        claimant-satna-jabalpur-fwd/-rev, which the t2 cone lands on -- cut an
        hour BEFORE storm-svc-1's own exposure at t6, so they reach the pair
        first.
    Both halves publish the SAME far horizon and therefore the SAME 147.535 G;
    only the near horizon's centre moves, and with it the competing claim.

    Real numbers, this half: the t2 cone (250.0 km from storm-svc-1, width 60,
    bearing 202.0 deg) sits over the real satna<->jabalpur corridor.
      claimant-satna-jabalpur-fwd  100G  p_cut 0.6247959105821317 -> 62.480 G
      claimant-satna-jabalpur-rev  100G  p_cut 0.6247959105821317 -> 62.480 G
      the two claimants together (one lightpath restores both) -> 124.96 G
    124.96 G < 147.535 G: the claim on the pair is still the smaller one, so
    buy the insurance.
    Correct: WIDE. Margin: 22.576 G (15.3% of storm-svc-1's own ecar, 18.1% of
    the claim's own ecar) -- both comfortably above `cone.py`'s own
    documented ~2.56e-4 Sobol sampling noise floor (~0.05 G at these
    100-300 G demands).

    The WIDE lever is a real optical_reroute via jabalpur costing 1 spare
    pair (confirmed against the real server under `reference_avoid={}`:
    `test_gold_spare_action_is_grounded_in_a_real_candidate` finds one and
    costs it correctly). Escaping via jabalpur genuinely clears BOTH
    storm-svc-1's working corridor (satna<->rewa) and its own static
    protection corridor (satna<->jhansi) -- `assert_escape_route_survives`
    confirms this exact route still exists and validates cleanly under
    basis=risk_group/level=risk_group.

    KNOWN, PRE-EXISTING FINDING (Task 14, 2026-08-30, out of this task's own
    scope to fix -- flagged rather than papered over): naming the SPECIFIC
    far-horizon risk group `rg_T2a_t1_t6` in the avoid set (rather than
    reference_avoid={}) no longer isolates satna<->rewa and satna<->jhansi
    the way it did when this rationale was first written. Since Task 5 of
    this same plan made satna<->jabalpur aerial too, and that span's satna
    end sits well inside this half's far cone's own ~100 km radius, the
    LIVE-minted `rg_T2a_t1_t6` now ALSO contains satna<->jabalpur --
    confirmed directly (`geo_mapper.map_geo_event_to_assets` against the t6
    cone returns all three of satna's aerial edges). Avoiding the FULL group
    by its risk-group id therefore excludes the jabalpur escape route TOO,
    and `route_service` returns zero candidates (`status=no_solution`) under
    EITHER basis, not merely one that fails validate_plan as originally
    described here. This does not change the comparison, the numbers, or the
    WIDE/NARROW gold label above (both remain honest statements about
    expected value), only the specific "name this one risk-group id" WORKED
    EXAMPLE of how the wide lever is reached -- see
    `test_t2a_carries_a_real_validate_plan_rejection` in test_episodes.py for
    the live-confirmed detail.
flip_variable: [claimant, spare, near, horizon]
