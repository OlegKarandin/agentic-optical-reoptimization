realized: {}                 # EQUAL in T2b -- nothing realized-cut this episode.
                              # storm-svc-1 is never at risk of being dropped
                              # either way, so gold.survived is trivially
                              # satisfiable and the pair scores purely on WHICH
                              # avoid the committed candidate used
                              # (decision_label), not on outcome.  A pre-t1
                              # realized cut CANNOT differ across the halves --
                              # see T2.md's "Why the flip has to be geometric".
gold:
  survived: [storm-svc-1]
  max_spares_wasted: 0
  decision_at_t0: wait
  label: wide
  rationale: |
    ONE spare transponder pair, two claims on it.
      * Spend it now on insurance for storm-svc-1 (WIDE avoid: route clear of
        the full far-horizon group -- an optical_reroute via jabalpur costing
        1 pair) and its 0.5198630338 x 300 G = 156.0 G of expected loss at t6
        goes away.
      * Hold it (NARROW avoid: avoid={}, an ip_reroute that reuses the current
        lightpath and costs nothing) and it stays available for the claimants
        the t2 cone lands on -- which are cut an hour BEFORE storm-svc-1's own
        exposure at t6, so they reach the pair first.
    Both halves publish the SAME far horizon and therefore the SAME 156.0 G;
    only the near horizon's centre moves, and with it the competing claim.

    Real numbers, this half: the t2 cone (300.0 km from storm-svc-1, width 60)
    sits on the EDGE of the kanpur/agra cluster.  Its eight 100 G services are
    exposed at p_cut 0.0757 (d0004, d0301), 0.0853 (d0028, d0123) and 0.0791
    (d0188, d0189, d0349, d0350) -- 63.8 G, or 71.1 G summed over every one of
    the 572 non-SUT services.  71.1 G < 156.0 G (2.19x): the claim on the pair
    is small, so buy the insurance.  Correct: WIDE.

    The t6 cone also sits on five further services (d0361 0.3973, d0029 and
    d0348 0.2814, d0212 and d0462 0.0693 -- 128.4 G).  That number is
    IDENTICAL in both halves (the far horizon is byte-identical), so it cannot
    discriminate; and those services are cut in the same hour as storm-svc-1
    itself, where a 300 G service outranks a 100 G one for the last pair
    whichever way this decision goes.  Only the t2 claimants -- cut an hour
    EARLIER -- actually compete for it.

    route_service(storm-svc-1, avoid={risk_groups: [rg_T2a_t1_t6]},
    basis=risk_group, level=risk_group) -- avoiding BOTH satna<->rewa and
    satna<->jhansi -- returns candidate_2, an optical_reroute via jabalpur
    costing 1 spare pair, which validates cleanly.  The same call under
    basis=physical does NOT validate: every route into allahabad that leaves
    satna by jabalpur still lands on jhansi<->allahabad, which storm-svc-1's
    own static protection lightpath uses, so validate_plan reports
    disjointness_collapse.  jhansi<->allahabad is BURIED and can therefore
    never be a member of a storm-derived (aerial-filter) risk group, which is
    exactly why basis=risk_group judges the candidate disjoint and
    basis=physical does not.  Confirmed against the real server.
flip_variable: [claimant, spare, near, horizon]
metadata:
  label_rule: avoid_horizon_at_decision_hour
  wide_avoid_risk_group: rg_T2a_t1_t6   # matches the runner's rg_{scenario}_{issued}_{horizon} minting
