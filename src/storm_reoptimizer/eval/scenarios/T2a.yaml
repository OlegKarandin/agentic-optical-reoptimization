realized: {}                 # nothing realized-cut this episode -- storm-svc-1
                              # is never at risk of being dropped either way, so
                              # gold.survived is trivially satisfiable and the
                              # pair scores purely on WHICH avoid the committed
                              # candidate used (decision_label), not on outcome
gold:
  survived: [storm-svc-1]
  max_spares_wasted: 0
  decision_at_t0: wait
  label: wide
  rationale: |
    Wide avoid costs the last spare pair; narrow avoid is an ip_reroute that
    costs none but sits inside the t+3 cone with P(re-exposure) = 0.3.
    T2a: svc-c has groomable survivors (probe: route_service(svc-c) returns an
      ip_reroute candidate), so the spare has no competing claim. Insurance
      costs ~0 and removes 0.3 * 300 G = 90 G of expected loss. Correct: wide.
    T2b: svc-c has no groomable survivor (probe: route_service(svc-c) returns
      optical_reroute only), so the spare is certainly claimed. Insurance costs
      1.0 * 300 G later to remove 0.3 * 300 G now. Correct: narrow.

    Real numbers, this half: route_service(storm-svc-1, avoid={risk_groups:
    [rg_T2a_t1_t2]}, basis=physical, level=link) -- avoiding ONLY the near
    (currently-exposed) corridor -- returns candidates that ALL genuinely fail
    validate_plan(disjointness_collapse): the cheapest routes off satna<->rewa
    funnel through satna<->jhansi, storm-svc-1's own STATIC protection
    corridor. Avoiding the FULL far-horizon group (rg_T2a_t1_t6, satna<->rewa
    + satna<->jhansi) under basis=risk_group/level=risk_group instead finds a
    genuinely disjoint, longer route via jabalpur (candidate_2, optical_reroute,
    1 spare pair) that validates cleanly -- confirmed against the real server.
flip_variable: [svc-c, groom, spare, re-exposed]
