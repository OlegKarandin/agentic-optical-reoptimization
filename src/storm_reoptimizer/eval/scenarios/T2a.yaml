                                # is checked directly by the derived-geometry
                                # assertion, which reads EVERY horizon's width)
  cone_motion_kmh: 300.0       # EQUAL in T2b -- the WITHIN-issuance motion
                                # (t2 centre -> t6 centre, one hour-label index
                                # step), the quantity derived.py measures.  Both
                                # halves' near centres are 300.0 km from the t6
                                # centre because the t6 centre IS storm-svc-1's
                                # own point and both near centres were solved
                                # onto the 300.0 km circle about it.
  n_future_claimants: 8        # EQUAL in T2b -- d0004, d0028, d0123, d0188,
                                # d0189, d0301, d0349, d0350 are the services
                                # over p_cut 0.05 at the t2 horizon in BOTH
                                # halves; only their p_cut differs
  exposure_horizon_hours: 2    # EQUAL in T2b (t1 -> t6 is two hour-label steps)
  spares_on_hand: 1            # EQUAL in T2b
  # W1.2's whole-suite check needs ONE global orientation, but the three pairs
  # draw gold labels from three vocabularies (act/wait, wide/narrow, A/B).
  # This is the common axis. Deliberately NOT in rules.OBSERVABLE_VARS or
  # assertions.SHARED_SCALARS: it is categorical and it IS the label, so
  # enumerating it would trivially solve every pair.
  gold_spare_action: spend      # gold label "wide": the optical_reroute costs 1 pair
